<main>
<h1>Submit Your Job Application</h1>

<h2>Join Our Team</h2>

<div id="career-accordion">

  <!-- Accordion Items -->
</div>

<!-- Modal Form -->
<div id="applyModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="positionTitle">Apply Now</h3>
    <form id="applyForm" method="POST" enctype="multipart/form-data" data-form-type="career">
      <input type="hidden" name="position" id="positionInput">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>
      <input type="file" name="resume" required>
      
      <!-- Cloudflare Turnstile Widget -->
      <div class="cf-turnstile-placeholder" style="margin-bottom: 15px; display: flex; justify-content: center;"></div>
<button type="submit" id="applySubmit" class="apply-btn">
        <span class="apply-btn-text">Submit Application</span>
        <span class="apply-btn-loading" hidden>
          <span class="spinner" style="display:inline-block; width:16px; height:16px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite; margin-right:8px; vertical-align:middle;"></span>
          Processing...
        </span>
      </button>
    </form>
  </div>
</div>

<script>
  const jobs = [
    { title: "Site Engineer", description: "Responsible for managing daily site operations, ensuring work quality, and coordinating with contractors and teams." },
    { title: "Construction Manager", description: "Oversees the entire construction process, ensuring timely project delivery, cost control, and adherence to safety protocols." },
    { title: "Project Manager", description: "Manages project planning, execution, and closure. Coordinates between clients, architects, and construction teams." },
    { title: "Quantity Surveyor", description: "Prepares tender documents, cost estimations, and ensures financial efficiency for construction projects." },
    { title: "Planning Engineer", description: "Develops detailed project schedules, monitors progress, and implements planning methodologies for efficient execution." },
    { title: "Business Development", description: "Identifies new business opportunities, builds client relationships, and works on strategies for business growth." },
    { title: "Architect", description: "Designs innovative building plans, collaborates with clients for requirements, and ensures aesthetic and functional excellence." },
    { title: "Structural Engineer", description: "Analyzes and designs building structures, ensuring stability, strength, and compliance with engineering standards." }
  ];

  const container = document.getElementById('career-accordion');
  jobs.forEach(job => {
    const item = document.createElement('div');
    item.className = 'accordion';
    item.innerHTML = `
      <div class="accordion-header" onclick="toggleAccordion(this)">${job.title}</div>
      <div class="accordion-content">
        <p>${job.description}</p>
        <button class="apply-btn" onclick="openModal('${job.title}')">Apply Now</button>
      </div>
    `;
    container.appendChild(item);
  });

  function toggleAccordion(header) {
    const content = header.nextElementSibling;
    content.style.display = (content.style.display === 'block') ? 'none' : 'block';
  }

  function openModal(position) {
    document.getElementById('applyModal').style.display = 'block';
    document.getElementById('positionTitle').innerText = `Apply for ${position}`;
    document.getElementById('positionInput').value = position;
  }

  function closeModal() {
    document.getElementById('applyModal').style.display = 'none';
  }

  window.onclick = function(e) {
    if (e.target == document.getElementById('applyModal')) closeModal();
  };
</script>

<script src="js/firebase-submit.js?v=4"></script>
<script>
  const formEl = document.getElementById('applyForm');
  if (formEl) {
    formEl.addEventListener('career-form-success', () => {
      if (typeof closeModal === 'function') closeModal();
    });
  }
</script>
</main>
