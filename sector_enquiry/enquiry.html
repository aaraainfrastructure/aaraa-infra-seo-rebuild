<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Enquiry | AARAA Infrastructure - Get a Quote for Construction Services</title>
<meta name="description" content="Submit your project enquiry to AARAA Infrastructure. Get a customized quote for industrial, commercial, institutional, or infrastructure construction services across India.">
<link rel="canonical" href="https://www.aaraainfrastructure.com/sector_enquiry/enquiry.html">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://www.aaraainfrastructure.com/#organization",
  "name": "AARAA Infrastructure Pvt Ltd",
  "url": "https://www.aaraainfrastructure.com",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+91-8681003111",
    "contactType": "customer service",
    "email": "info@aaraainfrastructure.com"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.aaraainfrastructure.com/"},
    {"@type": "ListItem", "position": 2, "name": "Enquiry", "item": "https://www.aaraainfrastructure.com/sector_enquiry/enquiry.html"}
  ]
}
</script>
  <!-- Firebase Import Map (CDN-based module resolution) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js"
    }
  }
  </script>
</head>
<body>
<main>
<h1 style="display:none;">Submit Your Project Enquiry</h1>

<!-- Enquiry Button (Triggers Popup) -->
<div style="padding-top: 30px;">
    <a href="javascript:void(0);" onclick="openPopup()" class="tf-btn hover-bg-secondary">
        <span class="text-uppercase">Enquiry Now</span>
        <div class="icon"><i class="icon-arrow-right"></i></div>
    </a>
</div>

<!-- Enquiry Popup -->
<div class="popup" id="enquiryPopup" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center; font-family:'Montserrat', sans-serif;">
    <div class="popup-content" style="background:#fff; padding:30px; border-radius:10px; max-width:700px; width:90%;">
        <h2 style="margin-top:0;">Submit an Enquiry</h2>
        <form id="enquiryForm" action="#" method="POST" data-form-type="contact">
            <div style="display:flex; flex-wrap:wrap; gap:20px;">
                <div style="flex:1;">
                    <input type="text" name="name" placeholder="Your Name" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                    <input type="tel" name="mobile" placeholder="Mobile Number" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; margin-top:10px;">
                    <input type="email" name="email" placeholder="Email Address" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; margin-top:10px;">
                </div>
                <div style="flex:1;">
                    <select name="service" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                        <option value="">Select Service</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Industrial">Industrial</option>
                        <option value="Institutional">Institutional</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Renewable">Renewable</option>
                        <option value="Interior Fit-Out">Interior Fit-Out</option>
                    </select>
                    <textarea name="message" placeholder="Your Message / Project Description" required style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:5px; margin-top:10px;"></textarea>
                </div>
            </div>
            
      <!-- Cloudflare Turnstile Widget -->
      <div class="cf-turnstile-placeholder" style="margin-bottom: 15px; display: flex; justify-content: center;"></div>
<button type="submit" style="background-color:#F15D23; color:white; border:none; padding:12px 20px; margin-top:20px; border-radius:5px; cursor:pointer;">Submit Enquiry</button>
        </form>
        <button onclick="closePopup()" style="background:#999; color:white; border:none; padding:10px 20px; margin-top:20px; border-radius:5px;">Close</button>
    </div>
</div>

<!-- JS -->
<script>
  function openPopup() {
    document.getElementById("enquiryPopup").style.display = "flex";
  }

  function closePopup() {
    document.getElementById("enquiryPopup").style.display = "none";
  }
</script>
  <!-- Firebase Universal Form Handler -->
  <script src="../js/firebase-submit.js?v=5"></script>
</main>

<script src="../js/aaraa-popups.js"></script>
<script src="../js/aaraa-modals.js"></script>

<!-- Cloudflare Turnstile API Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit" async defer></script>
</body>
</html>
