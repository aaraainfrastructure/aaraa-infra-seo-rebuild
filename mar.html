        /* --- General Setup (For Demo Purposes) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Utility Classes from your snippet --- */
        .mt-66 { margin-top: 66px; }
        .mb-2 { margin-bottom: 0.5rem; }

        /* --- Marquee Container --- */
        .tf-marquee {
            width: 100%;
            max-width: 1200px; /* or 100% depending on layout */
            background: white;
            padding: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            
            /* Optional: Add a fade effect on sides */
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        /* --- Wrapper: Holds the scrolling tracks --- */
        .marquee-wrapper {
            display: flex;
            overflow: hidden; /* Hides the content that goes outside */
            user-select: none;
            gap: 0; /* No gap here, gap is handled in items */
        }

        /* --- The Moving Track --- */
        .initial-child-container {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: space-around;
            
            /* The Animation Logic */
            /* We move it exactly -100% of its own width */
            animation: scroll-left 40s linear infinite;
        }

        /* --- Individual Items --- */
        .marquee-child-item {
            padding: 0 30px; /* Spacing between brands */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-item {
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-item img {
            display: block;
            height: 60px;     /* Fixed height ensures alignment */
            width: auto;      /* Width adjusts automatically */
            object-fit: contain;
            
            /* REMOVED: Grayscale filter so images show original color */
            /* filter: grayscale(100%) opacity(0.7); */
            transition: all 0.3s ease;
        }

        /* --- Hover Effects --- */
        
        /* Bring color back on hover */
        .brand-item:hover img {
            /* REMOVED: Filter reset as it is no longer needed */
            /* filter: grayscale(0%) opacity(1); */
            transform: scale(1.1);
        }

        /* Pause animation when user hovers the container */
        .marquee-wrapper:hover .initial-child-container {
            animation-play-state: paused;
        }

        /* --- The Keyframe Animation --- */
        @keyframes scroll-left {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-100%);
            }
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .brand-item img {
                height: 40px; /* Smaller logos on mobile */
            }
            .marquee-child-item {
                padding: 0 15px; /* Tighter spacing on mobile */
            }
        }
    </style>
