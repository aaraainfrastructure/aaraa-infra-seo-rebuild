  <style>
    /* Popup Style */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .popup-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }
    .popup-content h2 {
      margin-top: 0;
      color: #e0572a;
    }
    .popup-content input, .popup-content label {
      width: 100%;
      margin-bottom: 10px;
    }
    .popup-content input[type='submit'] {
      background-color: #e0572a;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    .popup-content .close {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }
    .success, .error {
      margin-top: 10px;
      font-weight: bold;
    }
    .success { color: green; }
    .error { color: red; }
  </style>

<main>
<h1>Vendor Registration Form</h1>
<a href="javascript:void(0)" class="header-btn" onclick="openPopup()">Become a Vendor</a>

<div class="popup" id="popupForm">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">&times;</span>
    <h2>Vendor Registration</h2>
    <form id="vendorForm" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="phone" placeholder="Phone Number" required>
      <input type="text" name="company" placeholder="Company Name" required>
      <input type="text" name="aadhaar" placeholder="Aadhaar Number" required>
      <input type="text" name="pan" placeholder="PAN Number" required>
      <input type="text" name="gst" placeholder="GST Number" required>
      <label>Aadhaar Document (PDF):</label>
      <input type="file" name="aadhaar_file" accept="application/pdf" required>
      <label>PAN Document (PDF):</label>
      <input type="file" name="pan_file" accept="application/pdf" required>
      <label>GST Document (PDF):</label>
      <input type="file" name="gst_file" accept="application/pdf" required>
      <input type="submit" value="Send">
      <div id="message"></div>
    </form>
  </div>
</div>

<script>
function openPopup() {
  document.getElementById('popupForm').style.display = 'flex';
}
function closePopup() {
  document.getElementById('popupForm').style.display = 'none';
}

// Form handled by Firebase app.js
</script>
