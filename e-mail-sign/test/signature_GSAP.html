    <style>
        /* Responsive adjustments for mobile clients */
        @media screen and (max-width: 650px) {
            .sig-table {
                width: 100% !important;
                display: block !important;
            }
            .sig-table tbody, .sig-table tr, .sig-table td {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            .sig-td-left {
                border-right: none !important;
                border-bottom: 1px solid #dcdcdc !important;
                padding-bottom: 20px !important;
                margin-bottom: 20px !important;
                text-align: center !important;
            }
            .sig-td-center {
                border-right: none !important;
                border-bottom: 1px solid #dcdcdc !important;
                padding: 0 0 20px 0 !important;
                margin-bottom: 20px !important;
                text-align: center !important;
            }
            .sig-td-right {
                padding-left: 0 !important;
            }
            .services-table {
                margin: 0 auto !important;
            }
            .contact-table {
                margin: 0 auto !important;
            }
            .social-table {
                margin: 15px auto 0 auto !important;
            }
        }

        /* Gemini Animated Border */
        .gemini-border-wrapper {
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc04, #4285f4);
            background-size: 400% 100%;
            animation: gemini-spin 4s linear infinite;
            padding: 3px; 
            display: inline-block;
            margin: 30px; 
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(66, 133, 244, 0.4), 0 0 50px rgba(155, 114, 203, 0.2);
        }

        @keyframes gemini-spin {
            0% { background-position: 0% 0; }
            100% { background-position: -400% 0; }
        }

        .sig-table {
            transition: box-shadow 0.4s ease;
            opacity: 0; /* Hidden initially to prevent flash of unstyled text before GSAP loads */
        }
        .sig-table:hover {
            box-shadow: inset 0 0 40px rgba(66, 133, 244, 0.15), inset 0 0 20px rgba(155, 114, 203, 0.1) !important;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://assets.codepen.io/16327/ScrambleTextPlugin3.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrambleTextPlugin);
            
            // Fade in the table to prevent flashing unstyled/unscrambled text
            gsap.to("#main-signature", { opacity: 1, duration: 0.2 });

            const scrambleElements = document.querySelectorAll('.gsap-scramble');
            
            scrambleElements.forEach((el, index) => {
                const originalText = el.innerText;
                
                // Clear the text initially
                el.innerText = "";
                
                // Animate text back in with ScrambleText
                gsap.to(el, {
                    duration: 1.5,
                    scrambleText: {
                        text: originalText,
                        chars: "upperAndLowerCase",
                        revealDelay: 0.2,
                        speed: 0.6
                    },
                    delay: 0.1 * index // Staggers the animation down the signature
                });
            });
        });
    </script>
</body>
